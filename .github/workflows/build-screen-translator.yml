name: Build Screen Translator APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'screen-translator/**'
      - '.github/workflows/build-screen-translator.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: screen-translator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: screen-translator-debug
          path: screen-translator/app/build/outputs/apk/debug/app-debug.apk
